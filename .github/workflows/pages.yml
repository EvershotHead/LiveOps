name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["demo/public-data/**", "frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build demo (static export)
        env:
          # 关键：CI 在海外，覆盖 .npmrc 里的 npmmirror 国内镜像，改用官方源
          npm_config_registry: https://registry.npmjs.org
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          mkdir -p public/public-data
          cp -r ../demo/public-data/* public/public-data/
          NEXT_PUBLIC_DEMO=1 pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
