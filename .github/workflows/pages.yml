name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["demo/public-data/**", "frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build demo (static export)
        run: |
          set -o pipefail
          cd frontend
          # 关键：项目 .npmrc 指向 npmmirror（国内镜像，CI 海外访问不稳定）。
          # npm_config_registry 环境变量优先级低于项目 .npmrc、对 pnpm 不生效，
          # 必须直接覆写 .npmrc 并用 --registry flag 双保险。
          echo "registry=https://registry.npmjs.org" > .npmrc
          pnpm install --frozen-lockfile --registry=https://registry.npmjs.org 2>&1 | tee /tmp/ci-build.log | tail -4
          mkdir -p public/public-data
          cp -r ../demo/public-data/* public/public-data/
          NEXT_PUBLIC_DEMO=1 pnpm build 2>&1 | tee -a /tmp/ci-build.log | tail -30
      - name: Upload build log on failure
        if: failure()
        run: |
          # 日志页面需登录才能查看；把尾部日志打成 ::error:: 注解（匿名可通过 API/页面读到）
          tail -n 30 /tmp/ci-build.log | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | cut -c1-500 | while IFS= read -r line; do
            echo "::error::$line"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
