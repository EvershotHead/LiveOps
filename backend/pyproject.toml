[project]
name = "liveops"
version = "0.1.0"
description = "LiveOps Community Intelligence - 游戏版本社区洞察与运营复盘系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "polars>=1.0",
    "pyarrow>=17.0",
    "duckdb>=1.0",
    "langgraph>=0.2",
    "openai>=1.40",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "portalocker>=2.10",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
liveops = "liveops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["liveops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
